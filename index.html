<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nota">Mi primera nota</div>
    <dialog id="editor">
    <h2>Editar nota</h2>

    <label for="textoNota">Texto de la nota</label>
    <textarea id="textoNota"></textarea>

    <label for="colorNota">Color de la nota</label>
    <input type="color" id="colorNota" value="#fff59d">

    <button id="guardarNota" type="button">Guardar</button>
    <button id="cancelarEdicion" type="button">Cancelar</button>
</dialog>
</body>
</html>
